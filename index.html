<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163b2f" />
    <meta name="description" content="毎日の収支と貯金目標をひとつにまとめるアプリ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>まいにち家計簿</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">MONEY JOURNAL</p>
        <div class="title-row"><h1>まいにち家計簿</h1><button class="icon-button" id="settingsButton" aria-label="設定">⚙</button></div>
      </header>

      <section class="period-bar" aria-label="表示月">
        <button id="previousMonth" aria-label="前の月">‹</button>
        <button id="monthPicker" class="month-label"><span id="currentMonth"></span><small>月を選択</small></button>
        <input id="monthInput" type="month" aria-label="月を選択" />
        <button id="nextMonth" aria-label="次の月">›</button>
      </section>

      <section class="hero-card" aria-label="今月の収支">
        <p>今月の残高</p>
        <strong id="monthlyBalance">¥0</strong>
        <div class="income-expense"><span>収入 <b id="monthlyIncome">¥0</b></span><span>支出 <b id="monthlyExpense">¥0</b></span></div>
      </section>

      <section class="saving-card" aria-label="貯金目標">
        <div class="section-heading"><div><p class="eyebrow">SAVING GOAL</p><h2 id="goalTitle">貯金目標</h2></div><button class="text-button" id="editGoal">編集</button></div>
        <div class="goal-numbers"><strong id="savedAmount">¥0</strong><span id="goalAmount">目標 ¥0</span></div>
        <div class="progress-track"><i id="goalProgress"></i></div>
        <p class="goal-note" id="goalNote">まずは目標を設定しましょう</p>
      </section>

      <section class="summary-grid" aria-label="支出の内訳">
        <article><span>いちばん多い支出</span><strong id="topCategory">—</strong><small id="topCategoryAmount">¥0</small></article>
        <article><span>今月の記録</span><strong id="transactionCount">0件</strong><small>入力した明細</small></article>
      </section>

      <section class="transactions-section">
        <div class="section-heading"><div><p class="eyebrow">TRANSACTIONS</p><h2>明細</h2></div><button class="filter-button" id="filterButton">すべて ▾</button></div>
        <div id="transactionList" class="transaction-list"></div>
        <p id="emptyState" class="empty-state">まだ記録がありません。<br>＋ を押して最初の明細を追加しましょう。</p>
      </section>
    </main>

    <button class="fab" id="addTransaction" aria-label="明細を追加">＋</button>
    <nav class="bottom-nav"><button class="active">⌂<span>ホーム</span></button><button id="analyticsButton">◔<span>分析</span></button><button id="goalsButton">◎<span>貯金</span></button></nav>

    <dialog id="transactionDialog"><form method="dialog" id="transactionForm" class="modal">
      <div class="modal-header"><h2 id="transactionDialogTitle">明細を追加</h2><button class="close" value="cancel" aria-label="閉じる">×</button></div>
      <input type="hidden" id="transactionId" />
      <div class="type-switch"><button type="button" class="selected" data-type="expense">支出</button><button type="button" data-type="income">収入</button></div>
      <label>金額<input id="amount" type="number" min="1" inputmode="numeric" placeholder="0" required /><span>円</span></label>
      <label>カテゴリー<select id="category"></select></label>
      <label id="newCategoryRow" hidden>新しいカテゴリ名<input id="newCategoryName" maxlength="18" placeholder="例：コンビニ・学費・服" /></label>
      <label>日付<input id="transactionDate" type="date" required /></label>
      <label>メモ <small>任意</small><input id="memo" maxlength="40" placeholder="例：スーパーで買い物" /></label>
      <button class="primary-button" id="saveTransaction" value="default">保存する</button>
      <button class="danger-button" id="deleteTransaction" type="button">この明細を削除</button>
    </form></dialog>

    <dialog id="goalDialog"><form method="dialog" id="goalForm" class="modal">
      <div class="modal-header"><h2>貯金目標を設定</h2><button class="close" value="cancel" aria-label="閉じる">×</button></div>
      <label>目標の名前<input id="goalNameInput" maxlength="24" placeholder="例：旅行資金" /></label>
      <label>目標金額<input id="goalTargetInput" type="number" min="1" inputmode="numeric" placeholder="100000" required /><span>円</span></label>
      <label>現在の貯金額<input id="goalSavedInput" type="number" min="0" inputmode="numeric" placeholder="0" required /><span>円</span></label>
      <button class="primary-button" value="default">保存する</button>
    </form></dialog>

    <dialog id="settingsDialog"><form method="dialog" class="modal"><div class="modal-header"><h2>データ管理</h2><button class="close" value="cancel">×</button></div><p class="settings-note">データはこの端末のブラウザ内に保存されています。</p><button class="secondary-button" id="exportButton" type="button">データをバックアップ</button><label class="import-label">バックアップを復元<input id="importInput" type="file" accept="application/json" /></label><button class="danger-button" id="clearData" type="button">すべてのデータを削除</button></form></dialog>
    <script src="app.js"></script>
  </body>
</html>
